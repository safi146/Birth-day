<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Bestie</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="env" id="env">
    <div class="back"></div>
    <div class="lt"></div>
    <div class="front"></div>
    <div class="to">For my bestie</div>
    <div class="flap"></div>
    <button class="seal" id="seal" aria-label="Open the letter">❤</button>
  </div>
  <div class="hint">Tap the seal to open</div>
</div>
<div class="paper">
  <div class="scroll" id="sc">
    <div id="text"></div>
  </div>
  <button class="ctrl" id="btn">Show all</button>
</div>

<audio id="music" loop>
  <source src="birthday-song.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" id="musicBtn" aria-label="Play music">
  ♫
</button>
<script src="script.js"></script>
</body>
</html>
